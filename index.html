<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anos | Controle de EPIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f6fd1;--dark:#0f428a;--soft:#f3f7fd;--banner:#e4eefa;--text:#1a1d21;--muted:#5b626b;--border:#d9e1ea;--red:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lato,system-ui,sans-serif;color:var(--text);background:#fff;min-height:100vh;border-top:8px solid var(--blue)}
.page{max-width:1200px;margin:0 auto;padding:40px 32px}
.eyebrow{width:60px;height:5px;background:var(--blue);margin-bottom:14px}
.kicker{color:var(--blue);font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:8px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-family:Raleway,sans-serif;font-weight:800;font-size:clamp(26px,4vw,38px)}
.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--blue);background:#fff;color:var(--dark);border-radius:10px;padding:10px 16px}
.btn.primary{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;border:2px solid var(--border);border-top:7px solid var(--blue);border-radius:12px;padding:22px;background:var(--soft);min-height:145px}
.card a{display:block;color:inherit;text-decoration:none;padding:5px 48px 5px 0}
.card h2{font:800 32px Raleway,sans-serif;color:var(--dark);margin-bottom:14px}
.card span{font-weight:700;color:var(--blue)}
.card button{position:absolute;top:12px;border:0;background:transparent;cursor:pointer;font-size:20px;padding:5px}
.edit{right:42px;color:var(--dark)}.remove{right:10px;color:var(--red)}
.new-card{border:2px dashed var(--border);border-radius:12px;background:#fff;min-height:145px;font:700 17px Lato,sans-serif;color:var(--blue);cursor:pointer}
.banner{margin-top:24px;padding:16px;border-radius:10px;background:var(--banner);color:var(--dark);font-weight:700}
footer{margin-top:28px;color:var(--muted);font-size:13px}
dialog{border:0;border-radius:16px;padding:26px;width:min(420px,94vw);margin:auto;box-shadow:0 20px 60px #0003}
dialog::backdrop{background:#0006}dialog h3{font-family:Raleway,sans-serif;margin-bottom:16px}
dialog input{width:100%;font:inherit;padding:11px;border:2px solid var(--border);border-radius:9px}
.error{min-height:22px;color:var(--red);font-size:13px;margin-top:8px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
@media(max-width:560px){.page{padding:28px 16px}.head{align-items:flex-start}}
</style>
</head>
<body>
<div class="page">
<div class="eyebrow"></div><div class="kicker">Controle de EPIs</div>
<div class="head"><h1>Selecione o ano</h1><button class="btn primary" id="openYear" type="button">+ Novo ano</button></div>
<div class="grid" id="grid"></div>
<div class="banner" id="status">Carregando anos do Google Sheets...</div>
<footer>Controle de entrega de EPIs</footer>
</div>
<dialog id="yearDialog">
<form method="dialog" id="yearForm">
<h3 id="dialogTitle">Novo ano</h3>
<input type="number" id="yearInput" placeholder="Ex.: 2027" min="1900" max="2999" required>
<div class="error" id="yearError"></div>
<div class="actions"><button type="button" class="btn" id="cancelYear">Cancelar</button><button type="submit" class="btn primary" id="submitBtn">Criar</button></div>
</form>
</dialog>
<script>
const grid=document.getElementById('grid'),dialog=document.getElementById('yearDialog'),yearInput=document.getElementById('yearInput'),yearError=document.getElementById('yearError'),statusEl=document.getElementById('status');
let years=[],editingYear=null;
function callServer(method,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));}
function render(){
 grid.replaceChildren();
 [...years].sort((a,b)=>a-b).forEach(year=>{
  const card=document.createElement('div');card.className='card';
  const link=document.createElement('a');link.href=`?page=planilha&ano=${encodeURIComponent(year)}`;link.setAttribute('aria-label',`Abrir planilha de ${year}`);
  const h=document.createElement('h2');h.textContent=year;const span=document.createElement('span');span.textContent='Abrir planilha →';link.append(h,span);
  const edit=document.createElement('button');edit.className='edit';edit.type='button';edit.title='Editar ano';edit.textContent='✎';edit.onclick=()=>openDialog(year);
  const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.title='Remover ano';remove.textContent='×';
  remove.onclick=async()=>{if(!confirm(`Remover o ano ${year} da tela inicial? Os registros da aba não serão apagados.`))return;await persistYears(years.filter(y=>y!==year));};
  card.append(link,edit,remove);grid.append(card);
 });
 const add=document.createElement('button');add.className='new-card';add.type='button';add.textContent='+ Novo ano';add.onclick=()=>openDialog();grid.append(add);
}
async function persistYears(next){
 statusEl.textContent='Salvando no Google Sheets...';
 try{years=await callServer('saveYears',next);render();statusEl.textContent='Anos sincronizados com o Google Sheets.';}
 catch(err){statusEl.textContent='Erro ao salvar: '+(err.message||err);alert('Não foi possível salvar os anos: '+(err.message||err));}
}
function openDialog(editYear=null){
 editingYear=editYear;document.getElementById('dialogTitle').textContent=editYear===null?'Novo ano':'Editar ano';
 document.getElementById('submitBtn').textContent=editYear===null?'Criar':'Salvar';
 yearInput.value=editYear!==null?editYear:Math.max(new Date().getFullYear(),...years.map(y=>y+1));
 yearError.textContent='';dialog.showModal();yearInput.select();
}
document.getElementById('openYear').onclick=()=>openDialog();
document.getElementById('cancelYear').onclick=()=>dialog.close();
document.getElementById('yearForm').addEventListener('submit',async e=>{
 e.preventDefault();const y=parseInt(yearInput.value,10);
 if(!Number.isInteger(y)||y<1900||y>2999){yearError.textContent='Informe um ano válido.';return;}
 if(y!==editingYear&&years.includes(y)){yearError.textContent='Esse ano já existe.';return;}
 let next=editingYear!==null?years.map(v=>v===editingYear?y:v):[...years,y];
 if(editingYear!==null&&editingYear!==y){try{await callServer('renameYear',editingYear,y);}catch(err){yearError.textContent=err.message||'Não foi possível renomear o ano.';return;}}
 dialog.close();await persistYears(next);
});
async function init(){try{years=await callServer('getYears');render();statusEl.textContent='Anos carregados do Google Sheets.';}catch(err){statusEl.textContent='Erro ao carregar anos: '+(err.message||err);}}
init();
</script>
</body>
</html>
